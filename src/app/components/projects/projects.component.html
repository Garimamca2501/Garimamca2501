<section class="section" id="projects">
  <div class="container">
    <h2 class="section-title">Featured Projects</h2>
    <p class="section-subtitle">
      These projects reflect my focus on backend logic, database efficiency, API workflows, and practical software delivery.
    </p>

    <div class="timeline">
      <article class="glass-card project-card" *ngFor="let project of projects">
        <div class="project-head">
          <div>
            <h3>{{ project.title }}</h3>
            <p>{{ project.role }}</p>
          </div>
          <span>{{ project.date }}</span>
        </div>
        <p class="tech-stack"><strong>Tech Stack:</strong> {{ project.tech }}</p>
        <ul>
          <li *ngFor="let item of project.highlights">{{ item }}</li>
        </ul>
      </article>
    </div>
  </div>
</section>
